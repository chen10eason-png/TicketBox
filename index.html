<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>TicketBox 我的票夾</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111827}.app{max-width:720px;margin:auto;padding:20px 16px 100px}h1{margin:4px 0;font-size:30px}.sub{color:#6b7280;margin-bottom:20px}.hero{background:linear-gradient(135deg,#111827,#334155);color:white;border-radius:24px;padding:22px;box-shadow:0 10px 30px #0002}.hero small{opacity:.75}.hero h2{margin:10px 0 4px}.pill{display:inline-block;background:#ffffff20;padding:7px 10px;border-radius:999px;margin:10px 4px 0 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.cat{border:0;background:white;border-radius:18px;padding:14px 5px;box-shadow:0 3px 12px #0000000d;font-size:13px}.cat b{font-size:24px;display:block;margin-bottom:5px}.section{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.tickets{display:grid;gap:12px}.ticket{background:white;border-radius:20px;padding:16px;box-shadow:0 3px 14px #0000000d}.ticket .top{display:flex;justify-content:space-between;gap:10px}.ticket h3{margin:0 0 5px}.muted{color:#6b7280;font-size:14px}.badge{background:#eef2ff;color:#3730a3;height:max-content;padding:6px 9px;border-radius:999px;font-size:12px}.fab{position:fixed;right:20px;bottom:82px;width:58px;height:58px;border-radius:50%;border:0;background:#111827;color:#fff;font-size:32px;box-shadow:0 8px 25px #0004}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffc;backdrop-filter:blur(18px);border-top:1px solid #ddd;display:flex;justify-content:center}.navin{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;border:0;padding:12px 4px 18px;color:#64748b}.nav button.active{color:#111827;font-weight:700}dialog{border:0;border-radius:24px;width:min(92%,520px);padding:22px}dialog::backdrop{background:#0008}label{display:block;font-size:13px;color:#475569;margin-top:12px}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;margin-top:5px;font:inherit}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:12px;border:0;border-radius:12px}.primary{background:#111827;color:#fff}.empty{text-align:center;color:#94a3b8;padding:30px}.search{width:100%;background:white;border:0;box-shadow:0 3px 12px #0000000d;padding:14px 16px;border-radius:16px;margin-top:18px}@media(max-width:430px){.grid{grid-template-columns:repeat(4,1fr)}.cat{font-size:11px;padding:12px 2px}}
</style></head><body><main class="app"><h1>TicketBox</h1><div class="sub">我的票夾・把每一次出發都收藏起來</div><section class="hero" id="next"><small>下一張票</small><h2>還沒有即將使用的票券</h2><div>按右下角 ＋ 加入你的第一張票</div></section><input id="search" class="search" placeholder="搜尋活動、場館、座位、城市…"><div class="grid"><button class="cat" data-type="棒球"><b>⚾️</b>棒球</button><button class="cat" data-type="演唱會"><b>🎤</b>演唱會</button><button class="cat" data-type="交通"><b>🚆</b>交通</button><button class="cat" data-type="展覽"><b>🖼️</b>展覽</button><button class="cat" data-type="電影"><b>🎬</b>電影</button><button class="cat" data-type="旅行"><b>✈️</b>旅行</button><button class="cat" data-type="樂園"><b>🎡</b>樂園</button><button class="cat" data-type="其他"><b>🎟️</b>其他</button></div><div class="section"><h2>我的票券</h2><span id="count" class="muted"></span></div><div id="tickets" class="tickets"></div></main><button class="fab" id="add">＋</button><nav class="nav"><div class="navin"><button class="active">🎟️<br>票券</button><button onclick="alert('月曆模式將在 v1.1 加入')">📅<br>月曆</button><button onclick="alert('回憶收藏將在 v1.1 加入')">❤️<br>收藏</button><button onclick="stats()">📊<br>統計</button></div></nav><dialog id="dlg"><form id="form"><h2>新增票券</h2><label>票券類型<select id="type"><option>棒球</option><option>演唱會</option><option>交通</option><option>展覽</option><option>電影</option><option>旅行</option><option>樂園</option><option>其他</option></select></label><label>活動名稱<input id="name" required placeholder="例：中信兄弟 vs 統一獅"></label><label>日期與時間<input id="date" type="datetime-local"></label><label>場館 / 地點<input id="place" placeholder="例：臺北大巨蛋"></label><label>座位 / 車次<input id="seat" placeholder="例：112區 8排16號"></label><label>票價<input id="price" type="number" min="0" placeholder="0"></label><label>備註<textarea id="note" rows="2"></textarea></label><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">儲存票券</button></div></form></dialog><script>
const KEY='ticketbox-v1';let data=JSON.parse(localStorage.getItem(KEY)||'[]'),filter='';const $=s=>document.querySelector(s);function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('#search').value.toLowerCase();let list=data.filter(x=>(!filter||x.type===filter)&&Object.values(x).join(' ').toLowerCase().includes(q)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));$('#count').textContent=data.length+' 張';$('#tickets').innerHTML=list.length?list.map(x=>`<article class="ticket"><div class="top"><div><h3>${esc(x.name)}</h3><div class="muted">${x.date?new Date(x.date).toLocaleString('zh-TW'): '未設定時間'}${x.place?' ・ '+esc(x.place):''}</div>${x.seat?`<div style="margin-top:8px">🎫 ${esc(x.seat)}</div>`:''}</div><span class="badge">${esc(x.type)}</span></div><div style="margin-top:12px;display:flex;justify-content:space-between"><span>${x.price?'NT$ '+Number(x.price).toLocaleString():''}</span><button onclick="del('${x.id}')" style="border:0;background:none;color:#94a3b8">刪除</button></div></article>`).join(''):'<div class="empty">目前沒有符合條件的票券</div>';let now=new Date(),up=data.filter(x=>x.date&&new Date(x.date)>=now).sort((a,b)=>a.date.localeCompare(b.date))[0];if(up){let days=Math.ceil((new Date(up.date)-now)/86400000);$('#next').innerHTML=`<small>下一張票 ・ ${esc(up.type)}</small><h2>${esc(up.name)}</h2><div>${new Date(up.date).toLocaleString('zh-TW')} ${up.place?'｜'+esc(up.place):''}</div>${up.seat?`<span class="pill">${esc(up.seat)}</span>`:''}<span class="pill">${days<=0?'今天':days+' 天後'}</span>`}else $('#next').innerHTML='<small>下一張票</small><h2>還沒有即將使用的票券</h2><div>按右下角 ＋ 加入你的第一張票</div>'}window.del=id=>{if(confirm('確定刪除這張票？')){data=data.filter(x=>x.id!==id);save()}};window.stats=()=>alert(`目前收藏 ${data.length} 張票券\n總票價 NT$ ${data.reduce((s,x)=>s+(+x.price||0),0).toLocaleString()}`);$('#add').onclick=()=>$('#dlg').showModal();$('#cancel').onclick=()=>$('#dlg').close();$('#form').onsubmit=e=>{e.preventDefault();data.push({id:crypto.randomUUID(),type:$('#type').value,name:$('#name').value,date:$('#date').value,place:$('#place').value,seat:$('#seat').value,price:$('#price').value,note:$('#note').value});save();e.target.reset();$('#dlg').close()};$('#search').oninput=render;document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{filter=filter===b.dataset.type?'':b.dataset.type;render()});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
